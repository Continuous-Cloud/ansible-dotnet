---
### REQUIRED
# The namespace of the collection
namespace: continuouscloud

# The name of the collection. Has the same character restrictions as 'namespace'
name: dotnet

authors: []

# Enter a short description for the collection. A longer one can go in ./docs/description.md
description: >-
  Contains roles that install dotnet

# Any roles/collections that this repo has a dependency on.
# https://docs.ansible.com/ansible/latest/dev_guide/developing_collections_shared.html#listing-collection-dependencies
dependencies: {}

# The URL of the originating SCM repository
repository: 'https://github.com/Continuous-Cloud/ansible-dotnet'

version: '1.0.0'
readme: README.md
license:
  - 'GPL-2.0-or-later'
license_file: ''
tags: []

build_ignore:
  - .venv
  - .ansible
